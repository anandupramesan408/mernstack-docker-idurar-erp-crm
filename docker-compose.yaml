services:
  mongodb:
    container_name: mongo
    image: mongo:latest
    volumes:
      - ./mongo-data:/data/db
    ports:
      - 27017:27017
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./frontend/.env
    ports:
      - 8080:3000
  
  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - 5000:8888
    depends_on:
      - mongodb