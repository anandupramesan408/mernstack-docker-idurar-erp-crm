apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-backend
  labels:
    app: crm-backend
    env: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crmapp-backend
  template:
    metadata:
      labels:
        app: crmapp-backend
    spec:
      containers:
      - name: backend
        image: anandu408/backend
        ports:
        - containerPort: 5000